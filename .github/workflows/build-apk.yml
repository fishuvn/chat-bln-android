name: Build Android APKs & Auto-Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Loại tăng phiên bản (auto | patch | minor | major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      explicit_version:
        description: 'Ghi đè phiên bản cụ thể (ví dụ 2.0.0, để trống nếu tự động)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build 3 Signed APKs & Publish Release
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute Next Version & Generate Changelog
        id: ver
        run: |
          python3 .github/scripts/compute-release.py \
            --platform "Chat BLN Android" \
            --bump "${{ inputs.bump_type || 'auto' }}" \
            --explicit-version "${{ inputs.explicit_version || '' }}" \
            --release-notes-out "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --apply-files

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/chatbln-release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias chatbln \
              -storepass chatbln123 \
              -keypass chatbln123 \
              -dname "CN=Chat BLN, OU=Nhom 3, O=ChatBLN, L=Hanoi, S=HN, C=VN"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build Release APKs (ARM 32-bit, ARM 64-bit, ARM Universal)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'chatbln123' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'chatbln' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'chatbln123' }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.version }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.build_number }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect & Verify 3 APK Outputs
        run: |
          mkdir -p dist-apk
          VER="${{ steps.ver.outputs.version }}"
          BLD="${{ steps.ver.outputs.build_number }}"
          ls -lh app/build/outputs/apk/release/

          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist-apk/ChatBLN-arm32-v7a.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist-apk/ChatBLN-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist-apk/ChatBLN-arm-universal.apk

          for f in ChatBLN-arm32-v7a.apk ChatBLN-arm64-v8a.apk ChatBLN-arm-universal.apk; do
            if [ ! -s "dist-apk/$f" ]; then
              echo "ERROR: Missing or empty APK $f"
              exit 1
            fi
          done

          cp CHANGELOG.md dist-apk/CHANGELOG.md
          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)

          {
            cat "$RUNNER_TEMP/RELEASE_NOTES.md"
            echo ""
            echo "### 📦 Gói cài đặt Android (\`v${VER}\` — Base VersionCode \`${BLD}\`)"
            echo "| File APK | Kiến trúc đích | Dung lượng |"
            echo "| :--- | :--- | :--- |"
            echo "| \`ChatBLN-arm32-v7a.apk\` | ARM 32-bit (\`armeabi-v7a\`) | $(du -h dist-apk/ChatBLN-arm32-v7a.apk | cut -f1) |"
            echo "| \`ChatBLN-arm64-v8a.apk\` | ARM 64-bit (\`arm64-v8a\`) | $(du -h dist-apk/ChatBLN-arm64-v8a.apk | cut -f1) |"
            echo "| \`ChatBLN-arm-universal.apk\` | ARM Universal (\`armeabi-v7a\` + \`arm64-v8a\`) | $(du -h dist-apk/ChatBLN-arm-universal.apk | cut -f1) |"
            echo ""
            echo "### 🔒 SHA-256 Checksums"
            echo '```text'
            cat dist-apk/SHA256SUMS.txt
            echo '```'
          } > dist-apk/FULL_RELEASE_BODY.md

          cat dist-apk/FULL_RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bundle (All 3 APKs + CHANGELOG + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: ChatBLN-Android-All-APKs-v${{ steps.ver.outputs.version }}
          path: |
            dist-apk/ChatBLN-arm32-v7a.apk
            dist-apk/ChatBLN-arm64-v8a.apk
            dist-apk/ChatBLN-arm-universal.apk
            dist-apk/CHANGELOG.md
            dist-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit Version & Changelog + Tag Release
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION CHANGELOG.md app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Notice: skipped pushing release commit to main, tagging HEAD directly."
          fi

          git tag -fa "$TAG" -m "Release ${TAG}"
          for attempt in 1 2 3; do
            git push origin "refs/tags/${TAG}" --force && break
            sleep 2
          done || echo "Notice: action-gh-release will create tag ${TAG} via REST API."

      - name: Publish GitHub Release Automatically
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: main
          name: "Chat BLN Android ${{ steps.ver.outputs.tag }}"
          body_path: dist-apk/FULL_RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist-apk/ChatBLN-arm32-v7a.apk
            dist-apk/ChatBLN-arm64-v8a.apk
            dist-apk/ChatBLN-arm-universal.apk
            dist-apk/CHANGELOG.md
            dist-apk/SHA256SUMS.txt
