name: Build Android APKs (ARM32, ARM64, Universal)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tạo bản GitHub Release đính kèm 3 file APK ngay sau khi build'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tên tag phát hành (khi bật create_release)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Build 3 Signed APKs (ARM32 / ARM64 / Universal)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/chatbln-release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias chatbln \
              -storepass chatbln123 \
              -keypass chatbln123 \
              -dname "CN=Chat BLN, OU=Nhom 3, O=ChatBLN, L=Hanoi, S=HN, C=VN"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build Release APKs (ARM 32-bit, ARM 64-bit, ARM Universal)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'chatbln123' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'chatbln' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'chatbln123' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect & Verify 3 APK Outputs
        run: |
          mkdir -p dist-apk
          ls -lh app/build/outputs/apk/release/

          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist-apk/ChatBLN-arm32-v7a.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist-apk/ChatBLN-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist-apk/ChatBLN-arm-universal.apk

          for f in ChatBLN-arm32-v7a.apk ChatBLN-arm64-v8a.apk ChatBLN-arm-universal.apk; do
            if [ ! -s "dist-apk/$f" ]; then
              echo "ERROR: Missing or empty APK $f"
              exit 1
            fi
          done

          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)

          {
            echo "## Android APK Artifacts"
            echo ""
            echo "| File APK | Kiến trúc đích | Dung lượng |"
            echo "| :--- | :--- | :--- |"
            echo "| \`ChatBLN-arm32-v7a.apk\` | ARM 32-bit (\`armeabi-v7a\`) | $(du -h dist-apk/ChatBLN-arm32-v7a.apk | cut -f1) |"
            echo "| \`ChatBLN-arm64-v8a.apk\` | ARM 64-bit (\`arm64-v8a\`) | $(du -h dist-apk/ChatBLN-arm64-v8a.apk | cut -f1) |"
            echo "| \`ChatBLN-arm-universal.apk\` | ARM Universal (\`armeabi-v7a\` + \`arm64-v8a\`) | $(du -h dist-apk/ChatBLN-arm-universal.apk | cut -f1) |"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```text'
            cat dist-apk/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK — ARM 32-bit (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: ChatBLN-arm32-v7a-apk
          path: dist-apk/ChatBLN-arm32-v7a.apk
          if-no-files-found: error

      - name: Upload APK — ARM 64-bit (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: ChatBLN-arm64-v8a-apk
          path: dist-apk/ChatBLN-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload APK — ARM Universal
        uses: actions/upload-artifact@v4
        with:
          name: ChatBLN-arm-universal-apk
          path: dist-apk/ChatBLN-arm-universal.apk
          if-no-files-found: error

      - name: Upload Bundle (All 3 APKs + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: ChatBLN-Android-All-APKs
          path: dist-apk/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release (3 APKs)
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          name: ChatBLN-Android-All-APKs
          path: release-assets

      - name: Publish Release with 3 APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: "Chat BLN Android ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}"
          generate_release_notes: true
          files: |
            release-assets/ChatBLN-arm32-v7a.apk
            release-assets/ChatBLN-arm64-v8a.apk
            release-assets/ChatBLN-arm-universal.apk
            release-assets/SHA256SUMS.txt
