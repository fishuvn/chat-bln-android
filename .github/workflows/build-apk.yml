name: Build Rust Android APKs & Auto-Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Loại tăng phiên bản (auto | patch | minor | major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      explicit_version:
        description: 'Ghi đè phiên bản cụ thể (ví dụ 3.0.0, để trống nếu tự động)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build 3 Rust Signed APKs & Publish Release
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute Next Version & Generate Changelog
        id: ver
        run: |
          python3 .github/scripts/compute-release.py \
            --platform "Chat BLN Android (Rust)" \
            --bump "${{ inputs.bump_type || 'auto' }}" \
            --explicit-version "${{ inputs.explicit_version || '' }}" \
            --release-notes-out "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --apply-files

      - name: Set up Rust Toolchain (ARM32 + ARM64 Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Run Rust Unit Tests (API, STOMP 1.2 & Update Checker)
        run: cargo test --lib --no-default-features

      - name: Install Dioxus CLI v0.7.10 (dx)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/dx" --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Google Maven Central Mirror (prevent HTTP 429)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/maven-mirror.gradle" <<'EOF'
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2"
          def patchRepos = { repoHandler ->
              repoHandler.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url.toString()
                      if (u.startsWith("https://repo.maven.apache.org/maven2") || u.startsWith("https://repo1.maven.org/maven2")) {
                          repo.setUrl(mirrorUrl)
                      }
                  }
              }
          }
          gradle.beforeProject { project ->
              patchRepos(project.buildscript.repositories)
              patchRepos(project.repositories)
          }
          gradle.settingsEvaluated { settings ->
              patchRepos(settings.pluginManagement.repositories)
              patchRepos(settings.dependencyResolutionManagement.repositories)
          }
          EOF
          echo "org.gradle.internal.http.connectionTimeout=60000" >> "$HOME/.gradle/gradle.properties"
          echo "org.gradle.internal.http.socketTimeout=60000" >> "$HOME/.gradle/gradle.properties"

      - name: Configure Android SDK & NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          NDK_DIR=$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            "$SDKMANAGER" "ndk;27.2.12479018"
            NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          fi
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "Using SDK=$SDK_ROOT NDK=$NDK_DIR BUILD_TOOLS=$BUILD_TOOLS"

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/chatbln-release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias chatbln \
              -storepass chatbln123 \
              -keypass chatbln123 \
              -dname "CN=Chat BLN, OU=Nhom 3, O=ChatBLN, L=Hanoi, S=HN, C=VN"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build & Package 3 Signed Rust APKs (arm32-v7a, arm64-v8a, universal)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'chatbln123' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'chatbln' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'chatbln123' }}
        run: |
          set -euo pipefail
          cp Dioxus.toml "$RUNNER_TEMP/Dioxus.toml.bak"
          cat >> Dioxus.toml <<EOF

          [bundle.android]
          jks_file = "${ANDROID_KEYSTORE_PATH}"
          jks_password = "${ANDROID_KEYSTORE_PASSWORD}"
          key_alias = "${ANDROID_KEY_ALIAS}"
          key_password = "${ANDROID_KEY_PASSWORD}"
          EOF

          mkdir -p dist-arm32 dist-arm64 dist-apk

          echo "=== Building ARM64 (aarch64-linux-android) ==="
          dx bundle --android --release --target aarch64-linux-android --package-types apk --out-dir dist-arm64
          ARM64_APK=$(find dist-arm64 target -name "*.apk" -type f | head -n 1)
          cp "$ARM64_APK" dist-apk/ChatBLN-arm64-v8a.apk

          echo "=== Building ARM32 (armv7-linux-androideabi) ==="
          dx bundle --android --release --target armv7-linux-androideabi --package-types apk --out-dir dist-arm32
          ARM32_APK=$(find dist-arm32 -name "*.apk" -type f | head -n 1)
          if [ -z "$ARM32_APK" ]; then
            ARM32_APK=$(find target -name "*.apk" -type f -newer dist-apk/ChatBLN-arm64-v8a.apk | head -n 1)
          fi
          cp "$ARM32_APK" dist-apk/ChatBLN-arm32-v7a.apk

          echo "=== Assembling Signed ARM Universal APK (armeabi-v7a + arm64-v8a) ==="
          WORK_UNI="$RUNNER_TEMP/uni-apk"
          rm -rf "$WORK_UNI" && mkdir -p "$WORK_UNI/arm32" "$WORK_UNI/merged"
          unzip -q dist-apk/ChatBLN-arm32-v7a.apk "lib/armeabi-v7a/*" -d "$WORK_UNI/arm32"
          cp dist-apk/ChatBLN-arm64-v8a.apk "$WORK_UNI/unsigned.apk"
          zip -qd "$WORK_UNI/unsigned.apk" "META-INF/*" || true
          (cd "$WORK_UNI/arm32" && zip -qr0 "$WORK_UNI/unsigned.apk" lib/armeabi-v7a)
          zipalign -p -f 4 "$WORK_UNI/unsigned.apk" "$WORK_UNI/aligned.apk"
          apksigner sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out dist-apk/ChatBLN-arm-universal.apk \
            "$WORK_UNI/aligned.apk"

          # Restore clean Dioxus.toml without CI keystore paths
          mv "$RUNNER_TEMP/Dioxus.toml.bak" Dioxus.toml

          for f in ChatBLN-arm32-v7a.apk ChatBLN-arm64-v8a.apk ChatBLN-arm-universal.apk; do
            if [ ! -s "dist-apk/$f" ]; then
              echo "ERROR: Missing or empty APK $f"
              exit 1
            fi
            apksigner verify "dist-apk/$f"
          done

          VER="${{ steps.ver.outputs.version }}"
          BLD="${{ steps.ver.outputs.build_number }}"
          cp CHANGELOG.md dist-apk/CHANGELOG.md
          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)

          {
            cat "$RUNNER_TEMP/RELEASE_NOTES.md"
            echo ""
            echo "### 📦 Gói cài đặt Android 100% Rust (\`v${VER}\` — Build \`${BLD}\`)"
            echo "| File APK | Kiến trúc đích | Dung lượng |"
            echo "| :--- | :--- | :--- |"
            echo "| \`ChatBLN-arm32-v7a.apk\` | ARM 32-bit (\`armeabi-v7a\`) | $(du -h dist-apk/ChatBLN-arm32-v7a.apk | cut -f1) |"
            echo "| \`ChatBLN-arm64-v8a.apk\` | ARM 64-bit (\`arm64-v8a\`) | $(du -h dist-apk/ChatBLN-arm64-v8a.apk | cut -f1) |"
            echo "| \`ChatBLN-arm-universal.apk\` | ARM Universal (\`armeabi-v7a\` + \`arm64-v8a\`) | $(du -h dist-apk/ChatBLN-arm-universal.apk | cut -f1) |"
            echo ""
            echo "### 🔒 SHA-256 Checksums"
            echo '```text'
            cat dist-apk/SHA256SUMS.txt
            echo '```'
          } > dist-apk/FULL_RELEASE_BODY.md

          cat dist-apk/FULL_RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bundle (All 3 Rust APKs + CHANGELOG + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: ChatBLN-Android-Rust-APKs-v${{ steps.ver.outputs.version }}
          path: |
            dist-apk/ChatBLN-arm32-v7a.apk
            dist-apk/ChatBLN-arm64-v8a.apk
            dist-apk/ChatBLN-arm-universal.apk
            dist-apk/CHANGELOG.md
            dist-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit Version & Changelog + Tag Release
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION CHANGELOG.md Cargo.toml Dioxus.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Notice: skipped pushing release commit to main."
          fi

          git tag -fa "$TAG" -m "Release ${TAG}"
          for attempt in 1 2 3; do
            git push origin "refs/tags/${TAG}" --force && break
            sleep 2
          done || echo "Notice: action-gh-release will create tag ${TAG} via REST API."

      - name: Publish GitHub Release Automatically
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: main
          name: "Chat BLN Android ${{ steps.ver.outputs.tag }}"
          body_path: dist-apk/FULL_RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist-apk/ChatBLN-arm32-v7a.apk
            dist-apk/ChatBLN-arm64-v8a.apk
            dist-apk/ChatBLN-arm-universal.apk
            dist-apk/CHANGELOG.md
            dist-apk/SHA256SUMS.txt
